name: Sitemap Check (색인 준비 상태 점검)

# 새 글이 master에 push되면 sitemap.xml 에 반영됐는지 자동 검증한다.
# 오류(깨진 robots.txt / 잘못된 URL / 404)가 있으면 워크플로가 실패하고
# GitHub Actions 로그에 원인이 찍힌다. (성공/실패 = 색인 준비 상태 신호)
#
# 이 워크플로는 색인을 직접 요청하지 않는다.
#   - 일반 글: Google은 sitemap 크롤에 맡긴다 (Indexing API는 채용공고 전용).
#   - 채용공고: google-indexing.yml 이 Indexing API로 색인을 직접 요청한다.

on:
  push:
    branches: [master]
    paths:
      - '_posts/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - '_automation/check_sitemap.py'
  schedule:
    # 매주 화요일 09:20 KST (매주 1회 헬스체크)
    - cron: '20 0 * * 2'
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: '배포 반영 대기 시간(분)'
        required: false
        default: '15'

concurrency:
  group: sitemap-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run sitemap check
        run: |
          python3 _automation/check_sitemap.py \
            --site https://a7420174.github.io \
            --repo-root . \
            --wait-minutes "${{ github.event.inputs.wait_minutes || '10' }}" \
            | tee sitemap-check.log

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-check-report
          path: sitemap-check.log
