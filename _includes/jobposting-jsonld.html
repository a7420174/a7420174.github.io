{%- comment -%}
JobPosting JSON-LD (채용공고 카테고리 글 전용).
데이터 원본: _data/jobpostings.json  ← _automation/generate_jobpostings.py 가 생성
마감일이 지난 공고는 생성 단계에서 제외되어 있으므로 여기에도 없다.
{%- endcomment -%}
{%- assign jp = site.data.jobpostings[page.slug] -%}
{%- if jp and jp.size > 0 -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": {{ page.title | jsonify }},
  "itemListElement": [
    {%- for job in jp -%}
    {
      "@type": "ListItem",
      "position": {{ forloop.index }},
      "item": {{ job | jsonify }}
    }{%- unless forloop.last -%},{%- endunless -%}
    {%- endfor -%}
  ]
}
</script>
{%- endif -%}
