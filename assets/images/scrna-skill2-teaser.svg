<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Noto Sans KR','Noto Sans CJK KR',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10302b"/>
      <stop offset="1" stop-color="#1a6b5a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg2)"/>

  <text x="80" y="110" fill="#9fd8c8" font-size="26" font-weight="700" letter-spacing="1">AI Agent · scRNA-seq 파이프라인 (Part 2)</text>
  <text x="80" y="178" fill="#ffffff" font-size="52" font-weight="800">스킬을 5개 엮으면?</text>
  <text x="80" y="232" fill="#e9f5f1" font-size="26">9단계 멀티툴 분석 · 스킬 사용 vs 미사용 · 각 5회</text>

  <!-- pipeline chips -->
  <g font-size="17" fill="#0f3d34">
    <g transform="translate(80,300)">
      <rect width="150" height="40" rx="20" fill="#bdeade"/><text x="75" y="26" text-anchor="middle">Load 10X</text>
    </g>
    <g transform="translate(245,300)"><rect width="90" height="40" rx="20" fill="#bdeade"/><text x="45" y="26" text-anchor="middle">QC</text></g>
    <g transform="translate(350,300)"><rect width="140" height="40" rx="20" fill="#bdeade"/><text x="70" y="26" text-anchor="middle">Doublet</text></g>
    <g transform="translate(505,300)"><rect width="150" height="40" rx="20" fill="#9fd8c8"/><text x="75" y="26" text-anchor="middle">Census</text></g>
    <g transform="translate(670,300)"><rect width="160" height="40" rx="20" fill="#9fd8c8"/><text x="80" y="26" text-anchor="middle">Cell type</text></g>
    <g transform="translate(845,300)"><rect width="150" height="40" rx="20" fill="#9fd8c8"/><text x="75" y="26" text-anchor="middle">PyDESeq2</text></g>
    <g transform="translate(80,360)"><rect width="150" height="40" rx="20" fill="#7fc9b4"/><text x="75" y="26" text-anchor="middle">Arboreto GRN</text></g>
    <g transform="translate(245,360)"><rect width="200" height="40" rx="20" fill="#7fc9b4"/><text x="100" y="26" text-anchor="middle">Reactome/KEGG</text></g>
    <g transform="translate(460,360)"><rect width="190" height="40" rx="20" fill="#7fc9b4"/><text x="95" y="26" text-anchor="middle">Open Targets</text></g>
