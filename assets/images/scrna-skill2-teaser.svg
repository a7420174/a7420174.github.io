  <text x="80" y="470" fill="#ffd9a8" font-size="30" font-weight="700">결론: 스킬은 만능이 아니었다</text>
  <text x="80" y="512" fill="#e9f5f1" font-size="21">· 같은 버그에 똑같이 막힘 (구버전 reference)</text>
  <text x="80" y="544" fill="#e9f5f1" font-size="21">· 그래도 DB는 실제로 조회하게 만들고, 일부 분석 선택은 고정</text>

  <text x="1120" y="600" fill="#6fae9d" font-size="18" text-anchor="end">BI Playground · scientific-agent-skills · Claude Code</text>
